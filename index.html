<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monster Mash Ave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="haunted-harvest.css">
</head>
<body>
  <main class="scene">
    <h1 class="title">Monster Mash Ave</h1>

    <div class="art" aria-hidden="true">
      <div class="moon"></div>
      <div class="city"></div>

      <!-- Costume shop, queue of customers, waving neighbour -->
      <div class="shop"><span class="sign">COSTUMES 🎃</span><span class="door"></span></div>
      <div class="queue"><span>🧟</span><span>🧛</span><span>🧙‍♀️</span></div>
      <div class="window">🧟‍♀️<b class="wave">👋</b></div>

      <div class="road"></div>

      <!-- Streetlights with eerie flicker -->
      <div class="lamp lamp-1"></div>
      <div class="lamp lamp-2"></div>
      <div class="lamp lamp-3"></div>

      <!-- Bats above the buildings -->
      <div class="bat bat-1"><i>🦇</i></div>
      <div class="bat bat-2 rtl"><i>🦇</i></div>
      <div class="bat bat-3"><i>🦇</i></div>

      <!-- Ghosts swooping between rooftops -->
      <div class="ghost ghost-1">👻</div>
      <div class="ghost ghost-2">👻</div>

      <!-- Cars driving by -->
      <div class="car car-1"><i>🚗</i></div>
      <div class="car car-2 rtl"><i>🚕</i></div>

      <div class="fog"></div>
      <div class="confetti"></div>
    </div>
  </main>
</body>
</html>
